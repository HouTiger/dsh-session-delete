name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No lockfile: the DSH devDependency is exact, so resolution stays stable
      # while a compat bump stays a one-line diff.
      - run: npm install --no-audit --no-fund
      - run: npm run test:all
